<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" sizes="128x128" href="/assets/icon.png">
<link rel="icon" type="image/x-icon" href="/assets/icon.ico">
<title>VRCDJ_bot — sign in</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --border:#2b313a;
  --fg:#e6edf3; --muted:#8b949e;
  --accent:#4d9fff; --good:#3fb950; --bad:#f85149; --warn:#d29922;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font-family:system-ui,"Segoe UI",Roboto,sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:360px;background:var(--panel);
  border:1px solid var(--border);border-radius:12px;padding:28px;
  box-shadow:0 12px 40px rgba(0,0,0,.45)}
.logo{font-size:28px;font-weight:800;letter-spacing:.5px;margin:0 0 4px;display:flex;align-items:center;gap:10px}
.logo img{width:32px;height:32px;border-radius:7px;display:block}
.logo span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin:0 0 22px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input[type=password]{width:100%;padding:11px 12px;border-radius:8px;
  border:1px solid var(--border);background:#0b0e13;color:var(--fg);
  font-size:15px}
input[type=password]:focus{outline:none;border-color:var(--accent)}
button{width:100%;margin-top:16px;padding:11px;border:none;border-radius:8px;
  background:var(--accent);color:#04121f;font-weight:700;font-size:15px;
  cursor:pointer}
button:hover{filter:brightness(1.08)}
.err{color:var(--bad);font-size:13px;margin:14px 0 0;min-height:16px}
</style>
</head>
<body>
  <form class="card" method="post" action="{{ url_for('login') }}">
    <div class="logo"><img src="/assets/icon.png" alt="" width="32" height="32"> VRCDJ<span>_bot</span></div>
    <p class="sub">DJ lookup &amp; time-slot dashboard</p>
    <label for="password">Password</label>
    <input type="password" id="password" name="password"
           autofocus autocomplete="current-password">
    <p class="err">{{ error or '' }}</p>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
